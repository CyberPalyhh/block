name: Compilación APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug estructura
        run: |
          echo "=== Directorio actual ==="
          pwd
          echo "=== Contenido ==="
          ls -la
          echo "=== Buscando buildozer.spec ==="
          find . -name "buildozer.spec" -type f

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install buildozer

      - name: Build APK
        run: |
          DIR=$(dirname $(find . -name "buildozer.spec" -type f | head -1))
          echo "Directorio del proyecto: $DIR"
          cd "$DIR"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: block-apk
          path: '**/bin/*.apk'
